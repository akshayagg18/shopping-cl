name: Audit official generator implementation structure
on:
  push:
    branches: [gpt6-generator-algorithm-audit]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect official generator source
        run: |
          curl --retry 3 -fsSL https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip -o /tmp/generator.zip
          mkdir /tmp/gen
          cd /tmp/gen
          unzip -q /tmp/generator.zip
          echo "GENERATOR_FILES"
          find generator -type f | head -35
          echo "ID_GENERATION_SITES"
          grep -R -n -E 'event_id|user_id|click_id|base36|format.*[euk]|fn.*id\(' generator/src | head -150
          echo "LINK_DISTRIBUTION_SITES"
          grep -R -n -E 'link|person|users|id_range|duplicate|user_count|whale' generator/src | head -140
          echo "SCRAMBLE_IMPL"
          sed -n '1,230p' generator/src/text.rs
          echo "USER_KEY_DERIVATION"
          grep -R -n -E 'event_key|user_key|click_key|scramble\(' generator/src/*.rs | head -110
          echo "GENERATOR_USER_ID_SOURCE"
          sed -n '115,143p' generator/src/user.rs
          echo "DATASET_SEED"
          sed -n '1,180p' generator/src/plan.rs

