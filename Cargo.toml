[package]
name = "ssp"
version = "0.1.0"
edition = "2024"

[features]
diagnostics = []
sampling = []

[dependencies]
libc = "0.2.191"
memmap2 = "0.9.12"
rayon = "1.12.0"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
